name: macOS CI and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.4.0'
        required: true
        type: string
      prerelease:
        description: 'Publish as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify native macOS build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify source and native core
        run: npm run verify

      - name: Build native macOS app
        run: swift build --package-path macos --product KimiAgentDesktop

  release:
    name: Build, notarize, and publish macOS release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      KIMI_VERSION: ${{ inputs.version || github.ref_name }}
      KIMI_DEVELOPER_ID_APPLICATION: ${{ secrets.KIMI_DEVELOPER_ID_APPLICATION }}
      KIMI_NOTARY_KEYCHAIN_PROFILE: KimiAgentNotary
      KIMI_NATIVE_VERIFY_RELEASE: '1'
      KEYCHAIN_PATH: ${{ runner.temp }}/kimi-agent-release.keychain-db
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Configure notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials "$KIMI_NOTARY_KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Verify source
        run: npm run verify

      - name: Package universal macOS release
        run: KIMI_NATIVE_ARCH=universal npm run native:package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          VERSION="${KIMI_VERSION#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="v$VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          if [ "$PRERELEASE" = "true" ]; then EXTRA="--prerelease"; else EXTRA=""; fi
          gh release create "$TAG" release-native/Kimi-Agent-Desktop-"$VERSION"-universal.dmg \
            release-native/Kimi-Agent-Desktop-"$VERSION"-universal.zip \
            release-native/Kimi-Agent-Desktop-"$VERSION"-universal-SHA256SUMS.txt \
            --title "Kimi Agent Desktop $VERSION" \
            --generate-notes \
            $EXTRA
