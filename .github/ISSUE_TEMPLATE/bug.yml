name: Bug report
description: Report an installation, connection, terminal, MCP, browser, or permission issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.0, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Installation, Kimi API, Conversation, Terminal, MCP, Browser, Computer Use, Git, Other]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Do not include API keys, tokens, passwords, or private source code.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostic output
      description: Use the application's diagnostic export and remove secrets before pasting.
